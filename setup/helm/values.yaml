imagePullPolicy: IfNotPresent

cluster:
  ingressDomain: labs.redhat.com

lab:
  namespace: lab

labHelm:
  namespace: lab-helm

podSecurityContext:
  runAsNonRoot: true
  seccompProfile:
    type: RuntimeDefault
containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]

postgresql:
  namespace: gitea
  image: docker.io/postgres:16.4-alpine
  auth:
    username: gitea
    password: "" # required
    database: gitea
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests: {cpu: 100m, memory: 256Mi}
    limits: {cpu: 500m, memory: 512Mi}

gitea:
  namespace: gitea
  image: quay.io/rhpds/gitea:latest
  admin:
    username: gitea-admin
    password: "" # required
    email: gitea-admin@example.invalid
  persistence:
    size: 5Gi
    storageClass: ""
  resources:
    requests: {cpu: 200m, memory: 1Gi}
    limits: {cpu: 500m, memory: 1Gi}
  rootUrl: "https://gitea:3000"
  appIni: |
    [security]
    INSTALL_LOCK = true
    [session]
    PROVIDER = file
    SESSION_NAME = gitea
    SESSION_SECURE = false
    [cors]
    ENABLED = true
    ALLOW_DOMAIN = *
    ALLOW_SUBDOMAIN = false
    METHODS = GET,HEAD,POST,PUT,PATCH,DELETE,OPTIONS
    MAX_AGE = 10m
    ALLOW_CREDENTIALS = false
datasphere:
  namespace: datasphere
  theme: earth
  api:
    image: quay.io/rhpds/datasphere-api:1.4.5
    replicas: 1
    extraDatacenters: []
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
    hpa:
      enabled: true
      minReplicas: 1
      maxReplicas: 5
      targetCPUUtilizationPercentage: 50
  ui:
    image: quay.io/rhpds/datasphere-ui:1.4.5
    replicas: 1
    resources:
      requests: {cpu: 25m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}
    route:
      host: ""
  redis:
    image: docker.io/redis:7.4.1-alpine
    resources:
      requests: {cpu: 50m, memory: 64Mi}
      limits: {cpu: 100m, memory: 128Mi}

repoSeed:
  image: docker.io/curlimages/curl:8.11.1
  archiveUrl: https://github.com/rhpds/ocp4-getting-started-automation/archive/7c4a971b02fab9a91c621a44b1afacb9dd552ffa.tar.gz
  archiveCommit: 7c4a971b02fab9a91c621a44b1afacb9dd552ffa
  repositories:
    - name: datasphere-api
      sourcePath: datasphere/api
      private: false
    - name: datasphere-ui
      sourcePath: datasphere/ui
      private: false
    - name: datasphere-gitops
      sourcePath: datasphere/gitops
      private: false
